<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget cadeaux</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a3b63">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#f6f4f1; --card:#ffffff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e7e2db;
    --green:#2f7d3c; --green-bg:#dcefd9; --orange:#c76a00; --orange-bg:#fde7c4;
    --red:#c0392b; --accent:#7a3b63; --accent-ink:#ffffff; --shadow:0 1px 3px rgba(40,30,20,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17150f; --card:#221f18; --ink:#f3efe8; --muted:#a39d91; --line:#383327;
      --green:#7fcf8a; --green-bg:#1f3a24; --orange:#f0a64a; --orange-bg:#47330f;
      --red:#ff7b6b; --accent:#d58bbb; --accent-ink:#1b1015; --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35}
  #app{max-width:560px;margin:0 auto;padding:16px 14px 110px}
  h1{font-size:22px;margin:4px 2px 14px;letter-spacing:-.01em}
  .topbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
  .topbar h1{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{min-width:44px;height:44px;border:none;border-radius:12px;background:var(--card);color:var(--ink);font-size:20px;box-shadow:var(--shadow);cursor:pointer}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .big-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px}
  .big.neg{color:var(--red)} .big.pos{color:var(--green)}
  .sub{font-size:13px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stat{background:var(--bg);border-radius:12px;padding:8px 10px}
  .stat b{display:block;font-size:15px}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat.g b{color:var(--green)} .stat.o b{color:var(--orange)}
  .bar{position:relative;height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;margin-top:12px}
  .bar i{display:block;height:100%}
  .bar .b{background:var(--green)} .bar .t{background:var(--orange)}
  .bar.over{outline:2px solid var(--red);outline-offset:-2px}
  .person{display:block;width:100%;text-align:left;border:none;color:inherit;font:inherit;cursor:pointer}
  .person .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .person .name{font-size:18px;font-weight:650}
  .person .rest{font-weight:700}
  .person .rest.neg{color:var(--red)}
  .person .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
  .section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px;display:flex;justify-content:space-between}
  .item{display:flex;align-items:center;gap:12px;border-radius:14px;padding:6px 12px 6px 6px;margin-bottom:8px;min-height:56px;cursor:pointer}
  .item.todo{background:var(--orange-bg)} .item.done{background:var(--green-bg)}
  .item .nm{flex:1;min-width:0;font-weight:550;word-break:break-word}
  .item.done .nm{color:var(--ink)}
  .item .pr{font-weight:700;white-space:nowrap}
  .check{width:44px;height:44px;flex:none;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
  .check span{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--orange);display:grid;place-items:center;font-size:15px;font-weight:800;color:transparent;background:transparent}
  .item.done .check span{background:var(--green);border-color:var(--green);color:#fff}
  .empty{color:var(--muted);text-align:center;padding:18px 10px;font-size:14px}
  .primary{display:block;width:100%;border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:650;padding:14px;cursor:pointer;margin-top:6px}
  .ghost{display:block;width:100%;border:1.5px dashed var(--line);border-radius:14px;background:transparent;color:var(--muted);font-size:15px;font-weight:600;padding:13px;cursor:pointer;margin-top:6px}
  .danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
  .fab{position:fixed;right:max(14px,calc(50% - 266px));bottom:20px;border:none;border-radius:28px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:650;padding:0 20px;height:54px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .scrim.open{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
  .sheet h2{margin:0 0 12px;font-size:19px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 2px 4px}
  input[type=text],input[type=number]{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  .switch{display:flex;align-items:center;gap:10px;margin:14px 2px 4px;font-size:15px;cursor:pointer}
  .switch input{width:22px;height:22px;accent-color:var(--green)}
  .btnrow{display:flex;gap:10px;margin-top:14px}
  .btnrow button{flex:1}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
  var DEFAULT = {people:[
    {id:'p1',name:'Lyakout',budget:150,items:[
      {id:'i1',name:'Chiffons',price:5.99,bought:true},
      {id:'i2',name:'Coussin',price:22.99,bought:true},
      {id:'i3',name:'Cube amandes noisettes',price:25.3,bought:false},
      {id:'i4',name:'Parfum/Sephora',price:100,bought:false}]},
    {id:'p2',name:'Parents',budget:250,items:[
      {id:'i5',name:'Simu aube',price:37.04,bought:true},
      {id:'i6',name:'Calendrier avent',price:39.9,bought:false},
      {id:'i7',name:'Table basse',price:33.2,bought:false},
      {id:'i8',name:'Coffrets rochers',price:43.1,bought:false},
      {id:'i9',name:'Carte YR',price:50,bought:false},
      {id:'i10',name:'Carte Illikado',price:50,bought:false}]}
  ]};

  var LS = 'budget-cadeaux-v1';
  var state = null, docRef = null, dirty = false, saving = false, timer = null, sync = 'local';
  var view = {page:'home', pid:null};

  var fmt = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
  function eur(n){ return fmt.format(Math.round(n*100)/100 + 0); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function parseNum(v){ var n = parseFloat(String(v).replace(',','.').replace(/\s/g,'')); return isFinite(n) && n>=0 ? n : null; }

  function totals(p){
    var b=0,t=0,nb=0;
    p.items.forEach(function(i){ if(i.bought){b+=i.price;nb++;} else t+=i.price; });
    return {bought:b,todo:t,all:b+t,rest:p.budget-b-t,nb:nb,n:p.items.length};
  }
  function globalTotals(){
    var g={budget:0,bought:0,todo:0,rest:0,nb:0,n:0};
    state.people.forEach(function(p){var t=totals(p);g.budget+=p.budget;g.bought+=t.bought;g.todo+=t.todo;g.nb+=t.nb;g.n+=t.n;});
    g.rest=g.budget-g.bought-g.todo; return g;
  }
  function findPerson(id){ return state.people.filter(function(p){return p.id===id;})[0]; }

  /* ---------- persistence ---------- */
  function loadLocal(){ try{ var s=localStorage.getItem(LS); if(s) return JSON.parse(s); }catch(e){} return null; }
  function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
  function touch(){
    saveLocal(); render();
    if(docRef){ dirty=true; clearTimeout(timer); timer=setTimeout(flush,400); }
  }
  function flush(){
    if(saving||!dirty||!docRef) return;
    saving=true; dirty=false;
    docRef.set(clone(state)).then(function(){ sync='ok'; }).catch(function(){ sync='err'; }).then(function(){
      saving=false; renderFoot(); if(dirty) flush();
    });
  }
  function renderFoot(){
    var el=document.getElementById('foot'); if(!el) return;
    el.textContent = sync==='ok' ? 'Enregistré' : sync==='err' ? "Enregistrement impossible pour l'instant" : sync==='wait' ? 'Synchronisation…' : 'Enregistré sur cet appareil';
  }

  /* ---------- rendering ---------- */
  function bar(t,budget){
    var denom=Math.max(budget,t.all,1);
    var over=t.all>budget;
    return '<div class="bar'+(over?' over':'')+'"><i class="b" style="width:'+(t.bought/denom*100)+'%"></i><i class="t" style="width:'+(t.todo/denom*100)+'%"></i></div>';
  }
  function restClass(r){ return r<-0.004?'neg':'pos'; }

  function render(){
    var app=document.getElementById('app');
    if(!state){ app.innerHTML=''; return; }
    if(view.page==='person'){
      var p=findPerson(view.pid);
      if(!p){ view={page:'home',pid:null}; } else { app.innerHTML=renderPerson(p); bind(); return; }
    }
    app.innerHTML=renderHome(); bind();
  }

  function renderHome(){
    var g=globalTotals();
    var h='<h1>Budget cadeaux</h1>';
    h+='<div class="card"><div class="big-label">Reste sur le budget total</div>'+
       '<div class="big '+restClass(g.rest)+'">'+eur(g.rest)+'</div>'+
       '<div class="sub">Budget total '+eur(g.budget)+' · '+g.nb+' / '+g.n+' cadeaux achetés</div>'+
       bar({bought:g.bought,todo:g.todo,all:g.bought+g.todo},g.budget)+
       '<div class="stats"><div class="stat"><span>Budget</span><b>'+eur(g.budget)+'</b></div>'+
       '<div class="stat g"><span>Acheté</span><b>'+eur(g.bought)+'</b></div>'+
       '<div class="stat o"><span>À acheter</span><b>'+eur(g.todo)+'</b></div></div></div>';
    h+='<div class="section-title"><span>Personnes</span></div>';
    state.people.forEach(function(p){
      var t=totals(p);
      h+='<button class="card person" data-open="'+esc(p.id)+'"><div class="row1"><span class="name">'+esc(p.name)+'</span>'+
         '<span class="rest '+(t.rest<-0.004?'neg':'')+'">'+eur(t.rest)+'</span></div>'+
         bar(t,p.budget)+
         '<div class="meta"><span>Budget '+eur(p.budget)+'</span><span>'+t.nb+' / '+t.n+' achetés</span></div></button>';
    });
    if(!state.people.length) h+='<div class="empty">Aucune personne pour le moment.</div>';
    h+='<button class="ghost" data-act="addPerson">+ Ajouter une personne</button>';
    h+='<div class="foot" id="foot"></div>';
    return h;
  }

  function itemRow(p,i){
    return '<div class="item '+(i.bought?'done':'todo')+'" data-edit="'+esc(i.id)+'">'+
      '<button class="check" data-toggle="'+esc(i.id)+'" aria-label="'+(i.bought?'Marquer à acheter':'Marquer acheté')+'"><span>✓</span></button>'+
      '<div class="nm">'+esc(i.name)+'</div><div class="pr">'+eur(i.price)+'</div></div>';
  }

  function renderPerson(p){
    var t=totals(p);
    var todo=p.items.filter(function(i){return !i.bought;});
    var done=p.items.filter(function(i){return i.bought;});
    var h='<div class="topbar"><button class="iconbtn" data-act="home" aria-label="Retour">‹</button><h1>'+esc(p.name)+'</h1>'+
          '<button class="iconbtn" data-act="editPerson" aria-label="Modifier la fiche">✎</button></div>';
    h+='<div class="card"><div class="big-label">Reste</div><div class="big '+restClass(t.rest)+'">'+eur(t.rest)+'</div>'+
       '<div class="sub">'+(t.rest<-0.004?'Dépassement du budget de '+eur(-t.rest):'Budget − achats − cadeaux prévus')+'</div>'+
       bar(t,p.budget)+
       '<div class="stats"><div class="stat"><span>Budget</span><b>'+eur(p.budget)+'</b></div>'+
       '<div class="stat g"><span>Acheté</span><b>'+eur(t.bought)+'</b></div>'+
       '<div class="stat o"><span>À acheter</span><b>'+eur(t.todo)+'</b></div></div></div>';
    h+='<div class="section-title"><span>À acheter</span><span>'+eur(t.todo)+'</span></div>';
    h+= todo.length ? todo.map(function(i){return itemRow(p,i);}).join('') : '<div class="empty">Rien à acheter 🎉</div>';
    h+='<div class="section-title"><span>Acheté</span><span>'+eur(t.bought)+'</span></div>';
    h+= done.length ? done.map(function(i){return itemRow(p,i);}).join('') : '<div class="empty">Aucun achat pour le moment</div>';
    h+='<div class="foot" id="foot"></div>';
    h+='<button class="fab" data-act="addItem">+ Cadeau</button>';
    return h;
  }

  /* ---------- events ---------- */
  function bind(){
    renderFoot();
    var app=document.getElementById('app');
    app.onclick=function(e){
      var el=e.target.closest('[data-toggle],[data-edit],[data-open],[data-act]');
      if(!el) return;
      if(el.hasAttribute('data-toggle')){ e.stopPropagation(); toggle(el.getAttribute('data-toggle')); return; }
      if(el.hasAttribute('data-edit')){ openItemSheet(el.getAttribute('data-edit')); return; }
      if(el.hasAttribute('data-open')){ go('person',el.getAttribute('data-open')); return; }
      var a=el.getAttribute('data-act');
      if(a==='home') go('home');
      else if(a==='addItem') openItemSheet(null);
      else if(a==='addPerson') openPersonSheet(null);
      else if(a==='editPerson') openPersonSheet(view.pid);
    };
  }
  function go(page,pid){
    view={page:page,pid:pid||null};
    try{ history.replaceState(null,'', page==='person' ? '#fiche-'+pid : '#accueil'); }catch(e){}
    render(); window.scrollTo(0,0);
  }
  function toggle(iid){
    var p=findPerson(view.pid); if(!p) return;
    p.items.forEach(function(i){ if(i.id===iid) i.bought=!i.bought; });
    touch();
  }

  /* ---------- sheets ---------- */
  var scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
  function openSheet(html){ sheet.innerHTML=html; scrim.classList.add('open'); }
  function closeSheet(){ scrim.classList.remove('open'); sheet.innerHTML=''; }
  scrim.addEventListener('click',function(e){ if(e.target===scrim) closeSheet(); });

  function openItemSheet(iid){
    var p=findPerson(view.pid); if(!p) return;
    var it = iid ? p.items.filter(function(i){return i.id===iid;})[0] : null;
    openSheet('<h2>'+(it?'Modifier le cadeau':'Nouveau cadeau pour '+esc(p.name))+'</h2>'+
      '<label for="f-name">Nom du produit</label><input type="text" id="f-name" value="'+(it?esc(it.name):'')+'" autocomplete="off">'+
      '<label for="f-price">Prix (€)</label><input type="text" inputmode="decimal" id="f-price" value="'+(it?String(it.price).replace('.',','):'')+'" autocomplete="off">'+
      '<label class="switch"><input type="checkbox" id="f-bought"'+(it&&it.bought?' checked':'')+'> Déjà acheté</label>'+
      '<div id="f-err" class="sub" style="color:var(--red);min-height:18px;margin-top:6px"></div>'+
      '<div class="btnrow"><button class="ghost" id="f-cancel" style="margin:0">Annuler</button><button class="primary" id="f-save" style="margin:0">Enregistrer</button></div>'+
      (it?'<button class="ghost danger" id="f-del" style="margin-top:12px">Supprimer ce cadeau</button>':''));
    document.getElementById('f-cancel').onclick=closeSheet;
    document.getElementById('f-save').onclick=function(){
      var name=document.getElementById('f-name').value.trim();
      var price=parseNum(document.getElementById('f-price').value);
      var err=document.getElementById('f-err');
      if(!name){ err.textContent='Indiquez un nom.'; return; }
      if(price===null){ err.textContent='Indiquez un prix valide (ex. 24,90).'; return; }
      var bought=document.getElementById('f-bought').checked;
      if(it){ it.name=name; it.price=price; it.bought=bought; }
      else p.items.push({id:uid(),name:name,price:price,bought:bought});
      closeSheet(); touch();
    };
    if(it){
      var d=document.getElementById('f-del'), armed=false;
      d.onclick=function(){
        if(!armed){ armed=true; d.textContent='Confirmer la suppression'; return; }
        p.items=p.items.filter(function(i){return i.id!==it.id;}); closeSheet(); touch();
      };
    }
  }

  function openPersonSheet(pid){
    var p = pid ? findPerson(pid) : null;
    openSheet('<h2>'+(p?'Fiche de '+esc(p.name):'Nouvelle personne')+'</h2>'+
      '<label for="f-name">Nom</label><input type="text" id="f-name" value="'+(p?esc(p.name):'')+'" autocomplete="off">'+
      '<label for="f-budget">Budget prévu (€)</label><input type="text" inputmode="decimal" id="f-budget" value="'+(p?String(p.budget).replace('.',','):'')+'" autocomplete="off">'+
      '<div id="f-err" class="sub" style="color:var(--red);min-height:18px;margin-top:6px"></div>'+
      '<div class="btnrow"><button class="ghost" id="f-cancel" style="margin:0">Annuler</button><button class="primary" id="f-save" style="margin:0">Enregistrer</button></div>'+
      (p?'<button class="ghost danger" id="f-del" style="margin-top:12px">Supprimer cette personne</button>':''));
    document.getElementById('f-cancel').onclick=closeSheet;
    document.getElementById('f-save').onclick=function(){
      var name=document.getElementById('f-name').value.trim();
      var b=parseNum(document.getElementById('f-budget').value);
      var err=document.getElementById('f-err');
      if(!name){ err.textContent='Indiquez un nom.'; return; }
      if(b===null){ err.textContent='Indiquez un budget valide (ex. 150).'; return; }
      if(p){ p.name=name; p.budget=b; closeSheet(); touch(); }
      else { var np={id:uid(),name:name,budget:b,items:[]}; state.people.push(np); closeSheet(); touch(); go('person',np.id); }
    };
    if(p){
      var d=document.getElementById('f-del'), armed=false;
      d.onclick=function(){
        if(!armed){ armed=true; d.textContent='Confirmer la suppression'; return; }
        state.people=state.people.filter(function(x){return x.id!==p.id;}); closeSheet(); touch(); go('home');
      };
    }
  }

  /* ---------- start ---------- */
  state = loadLocal() || clone(DEFAULT);
  if(!state || !Array.isArray(state.people)) state = clone(DEFAULT);
  (function(){
    var h=(location.hash||'').match(/^#fiche-(.+)$/);
    if(h && findPerson(h[1])) view={page:'person',pid:h[1]};
  })();
  render();

  try{
    if(window.claude && window.claude.use){
      sync='wait'; renderFoot();
      window.claude.use('db').then(function(db){
        if(!db){ sync='local'; renderFoot(); return; }
        docRef=db.doc('budget/state');
        docRef.onSnapshot(function(snap){
          if(dirty||saving) return;
          if(snap.exists){
            var d=snap.data();
            if(d && Array.isArray(d.people)){ state=clone(d); saveLocal(); if(view.page==='person'&&!findPerson(view.pid)) view={page:'home',pid:null};
              if(!scrim.classList.contains('open')) render(); }
          }
          if(!snap.metadata.fromCache){ sync='ok'; renderFoot(); }
        }, function(){ sync='err'; renderFoot(); });
      }).catch(function(){ sync='local'; renderFoot(); });
    }
  }catch(e){}
})();
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); }catch(e){}
</script>
</body>
</html>
